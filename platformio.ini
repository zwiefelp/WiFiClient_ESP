; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Gemeinsame Einstellungen fuer alle Umgebungen
[env]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
	knolleary/PubSubClient@^2.8
	adafruit/Adafruit GFX Library@^1.12.4

; Flashen per USB-Kabel (Standard)
;   pio run -e nodemcuv2 -t upload
[env:nodemcuv2]
upload_protocol = esptool
upload_speed = 115200

; Flashen drahtlos per OTA ueber WLAN
;   1. Geraet einmalig per USB mit OTA-faehiger Firmware flashen (s.o.)
;   2. Passwort als Umgebungsvariable setzen (NICHT hier eintragen!):
;        export OTA_PASSWORD='dein-ota-passwort'
;   3. Upload:  pio run -e nodemcuv2_ota -t upload
;   upload_port = mDNS-Name (<SECRET_OTA_HOSTNAME>.local) oder IP des Geraets
[env:nodemcuv2_ota]
upload_protocol = espota
upload_port = esp-display.local
upload_flags =
	--auth=${sysenv.OTA_PASSWORD}
